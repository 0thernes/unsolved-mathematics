  no-go barriers associated with four open problems (Collatz, Erdős–Straus,
  Lonely Runner, Brocard), paired with 6 non-vacuity witnesses and 8 explicit
  adversarial false-variant refutations. Explicitly does NOT prove any open
  conjecture: Collatz, Erdős–Straus (6 remaining Mordell quadratic-residue
