scope_and_limitations: >
  Formalizes 69 structural theorems, classical foundations, modular reductions,
  sharpness bounds, finite exhaustions, and a 3n-1 sibling-map comparison (not a
  formal barrier theorem) across eight open-problem domains (Collatz 31 incl.
  Fine–Wilf Odd-Unit-Lock Spine Valuation Ceiling, 2-adic isometry, periodic spine
  congruence, exhaustive d <= 7 & unconditional 1-/2-/3-odd-step positive-cycle
  exclusion for all d >= 1, sharp universal affine intercept ceiling, Eliahou–Steiner
  cycle amplitude ceiling, and catalytic reversible cylinder evaluation,
  Erdős–Straus 5, Lonely Runner 8 incl. constructive n=3 for all positive triples,
  Brocard 7 incl. n <= 20, Primes/Twin Primes 4, Goldbach 3 incl. 4 <= n <= 100,
  Odd Perfect/Mersenne Primes 7 incl. Complete Euclid–Euler Theorem with proved
  divSum_eq_divSumLin and Euler's 1750 Mersenne prime divisor congruence 2p | q - 1,
  and Ramsey Theory 4 proving exact R(3,3)=6 and R(3,4)=9), paired with 18 concrete
  non-vacuity witnesses and 22 explicit adversarial false-variant refutations (109
  audited declarations). All results are classical, elementary, or bounded structural
  identities; the 4-runner Lonely Runner case is classical (Betke–Wills 1972; Cusick
  1973), and the conjecture is proved for up to 13 runners in recent preprints
  (arXiv:2509.14111, arXiv:2511.22427, arXiv:2604.23906). Challenge.lean holds the
  69 sorry-stated comparator specifications; the proof modules contain zero sorry.
  Explicitly does NOT prove any open conjecture.
