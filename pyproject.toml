[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unsolved-mathematics-atlas"
version = "0.8.3"
description = "Reproducible ranked dossier of 120 open mathematical problems paired with a multi-kernel Lean 4.35.0 formal core, daily full Left to Solve mirror (26 programs / 62,790 targets), and deterministic RAG corpus."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Alexander S. Donahue", email = "0_0@0thernes.art" },
]
dependencies = [
  "PyYAML>=6.0,<7.0",
  "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "hypothesis>=6.100,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-PyYAML>=6.0,<7.0",
]
rag = [
  "numpy>=1.26,<3.0",
  "sentence-transformers>=3.0,<6.0",
]

# This is a data-and-scripts research atlas, not an importable Python package.
# Explicitly disable automatic package discovery so editable installs do not
# mistake the top-level `data/`, `lean/`, `paper/`, `problems/`, `rag/`, and
# `schema/` research directories for seven Python distributions.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["scripts", "rag", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["scripts", "rag", "examples"]
