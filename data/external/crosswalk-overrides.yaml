# Curated overrides for the Atlas <-> Left to Solve crosswalk
# (consumed by scripts/sync_external_programs.py; see docs/external/CROSSWALK.md).
#
# The automatic rule matches external items by normalized base title. Use
#   include: { <atlas-slug>: [<id> | {id: <id>, relation: primary|variant|related}, ...] }
#   exclude: { <atlas-slug>: [<id>, ...] }   to drop a false positive
# Every id must exist in the mirrored item index (data/external/lefttosolve/items/),
# every slug in data/problems.yaml; --check fails otherwise.
# Links are title/identity-level correspondences reviewed against the item id and title
# (AI-assisted, maintainer-directed); they are NOT statement-fidelity certifications.
# 'related' = a different but closely connected statement (never raises status signals).
include:
  p-versus-np:
    - {id: ComplexityTheory.P_ne_NP, relation: primary}
  navier-stokes-smoothness:
    - {id: NavierStokes.navier_stokes_existence_and_smoothness_R3, relation: primary}
    - {id: NavierStokes.navier_stokes_existence_and_smoothness_periodic, relation: primary}
  birch-swinnerton-dyer:
    - {id: WeierstrassCurve.Affine.Rat.weakBSD, relation: primary}
    - {id: WeierstrassCurve.Affine.Rat.strongBSD, relation: primary}
  odd-perfect-numbers:
    - {id: PerfectNumbers.odd_perfect_number_conjecture, relation: primary}
    - {id: PerfectNumbers.odd_perfect_number.lower_bound, relation: variant}
  mersenne-primes-infinitude:
    - {id: Mersenne.infinitely_many_mersenne_primes, relation: primary}
  hadwiger-nelson-problem:
    - {id: Erdos508.HadwigerNelsonProblem, relation: primary}
    - {id: Erdos508.HadwigerNelsonAtLeastFive, relation: variant}
  erdos-straus-conjecture:
