    - {id: Mandelbrot.density_of_hyperbolicity, relation: related}
  slice-ribbon-conjecture:
    - {id: opg-slice-ribbon-problem-0, relation: primary}
  seymour-second-neighborhood-conjecture:
    - {id: opg-seymours-second-neighbourhood-conjecture, relation: primary}
    - {id: wp-second-neighborhood-problem, relation: primary}
  total-coloring-conjecture:
    - {id: TotalColoringConjecture.total_coloring_conjecture, relation: primary}
    - {id: TotalColoringConjecture.total_coloring_conjecture.variants.maxDegree_le_five, relation: variant}
    - {id: opg-behzads-conjecture, relation: primary}
  catalan-dickson-conjecture:
    - {id: wp-catalan-dickson-conjecture-on-aliquot-sequences, relation: primary}
