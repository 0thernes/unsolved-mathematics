  hadamard-matrix-conjecture:
    - {id: Hadamard.HadamardConjecture, relation: primary}
    - {id: Hadamard.HadamardConjecture.variants.167, relation: variant}
    - {id: Hadamard.HadamardConjecture.variants.first_cases, relation: variant}
  montgomery-pair-correlation:
    - {id: MontgomeryPairCorrelationConjecture.montgomery_pair_correlation_conjecture, relation: primary}
    - {id: MontgomeryPairCorrelationConjecture.montgomery_pair_correlation_conjecture.variants.general_interval, relation: variant}
  hardy-littlewood-k-tuple:
    - {id: HardyLittlewood.first_hardy_littlewood_conjecture, relation: primary}
    - {id: PrimeTuplesConjecture.prime_tuples_conjecture, relation: related}
    - {id: Dickson.dickson_conjecture, relation: related}
  andrews-curtis-conjecture:
    - {id: AndrewsCurtis.andrews_curtis_conjecture, relation: primary}
  littlewood-conjecture:
    - {id: LittlewoodConjecture.littlewood_conjecture, relation: primary}
    - {id: LittlewoodConjecture.padic_littlewood_conjecture, relation: related}
  schinzel-hypothesis-h:
    - {id: Schinzel.schinzel_conjecture, relation: primary}
  whitehead-asphericity-conjecture:
    - {id: wp-whitehead-conjecture, relation: primary}
  caccetta-haggkvist-conjecture:
    - {id: opg-caccetta-haggkvist-conjecture, relation: primary}
  unit-distance-problem:
    - {id: Erdos90.erdos_90, relation: primary}
    - {id: Erdos90.erdos_90.variants.sawin_explicit, relation: variant}
    - {id: Erdos90.sawin_lattice_reduction, relation: related}
  falconer-distance-conjecture:
    - {id: wp-falconer-s-conjecture, relation: primary}
  artin-primitive-root-conjecture:
    - {id: ArtinPrimitiveRootsConjecture.artin_primitive_roots.parts.i, relation: primary}
    - {id: ArtinPrimitiveRootsConjecture.artin_primitive_roots.parts.ii, relation: variant}
    - {id: ArtinPrimitiveRootsConjecture.conditional_artin_primitive_roots.parts.i, relation: related}
  sarnak-mobius-conjecture:
    - {id: wp-sarnak-conjecture, relation: primary}
  mandelbrot-locally-connected:
