  kakeya-conjecture:
    - {id: Kakeya.kakeya_set_conjecture, relation: primary}
  hall-conjecture:
    - {id: Hall.hall_conjecture, relation: primary}
  kothe-conjecture:
    - {id: Koethe.KotheConjecture, relation: primary}
exclude: {}
