# Informational CI: runs on every push to main and reports. Never a required check; gates nothing (Build Standard v1.2.0 R1).
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # weekly drift & vulnerability check

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-matrix:
    name: Atlas & Verification Ladder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Registry schema, freshness, dossiers, papers, proof-claim, retraction, axiom-parity & manifest gates
        run: |
          python scripts/generate.py --check
          python scripts/validate.py
          python scripts/check_dossiers.py --strict
          python scripts/check_papers.py
          python scripts/proof_claim_sweep.py
          python scripts/check_retractions.py --check
          python scripts/check_readme_axioms.py
          python scripts/sync_external_programs.py --check
          python scripts/build_site.py
          python scripts/build_data_manifest.py --check
          python scripts/timestamp_manifest.py --check

      - name: Verify deterministic rebuild (zero drift)
        shell: bash
        run: |
          python scripts/generate.py
          python rag/build_corpus.py
          git diff --exit-code -- RANKING.md data/problems.json rag/corpus.jsonl \
            || (echo "::error::Generated views drifted after rebuild." && exit 1)

      - name: Run full test ladder (unit, negative, regression, Hypothesis, differential, metamorphic)
        run: python -m pytest -v tests/

      - name: Run targeted mutation testing suite (100% kill required)
        run: python tests/mutation_check.py

  lean-formal:
    name: Lean 4.35.0 Multi-Kernel Formal Core (6-kernel paranoid + comparator, 118 declarations)
    runs-on: ubuntu-latest
    # The comparator is intentionally exhaustive, but must not leave an
    # indefinitely hung runner without a terminal CI result.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install bubblewrap sandbox for lake check / lake comparator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install elan & Lean 4.35.0 toolchain
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"

      - name: Audit forbidden tokens & Palomar limits (zero sorry/admit/native_decide/custom axiom)
        run: python3 scripts/check_readme_axioms.py

      - name: Build Lean 4.35.0 package & verify axioms strictly within standard set (118 declarations)
        working-directory: lean
        run: |
          lake build Challenge Solution NonVacuity Adversarial
          lake env lean VerifyAxioms.lean | tee axioms.log
          python3 - <<'PY'
          import re
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          txt = open("axioms.log", encoding="utf-8").read()
          matches = list(re.finditer(
              r"'([^']+)' (?:depends on axioms: \[([^\]]*)\]|does not depend on any axioms)",
              txt,
              re.S,
          ))
          assert len(matches) >= 118, f"Expected >=118 audited declarations, got {len(matches)}"
          for m in matches:
              name = m.group(1)
              raw = m.group(2) or ""
              used = {a.strip() for a in raw.split(",") if a.strip()}
              bad = used - allowed
              assert not bad, f"Disallowed axiom(s) {bad} in {name}"
          print(f"OK: audited {len(matches)} theorems/witnesses/refutations — strictly within {sorted(allowed)}.")
          PY

      - name: Live negative Lean 4.35.0 kernel & axiom-gate rejection test
        run: python3 scripts/test_lean_negative.py

      - name: Replay through leanchecker-paranoid --fresh
        working-directory: lean
        run: |
          timeout --signal=TERM --kill-after=30s 600s lake env leanchecker-paranoid --fresh Solution
          timeout --signal=TERM --kill-after=30s 600s lake env leanchecker-paranoid --fresh NonVacuity
          timeout --signal=TERM --kill-after=30s 600s lake env leanchecker-paranoid --fresh Adversarial

      - name: Run sandboxed 6-kernel lake check --paranoid & lake comparator --paranoid
        working-directory: lean
        run: |
          timeout --signal=TERM --kill-after=30s 900s lake check --paranoid
          timeout --signal=TERM --kill-after=30s 900s lake comparator --config comparator.json --paranoid

  native-catalytic-audit:
    name: Catalytic Native Collatz Engine (C17/BMI2 · ASan/UBSan · 250k Fuzzer · Safe Rust Oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build C17+BMI2 catalytic & Asymmetric Hydra engines & run exact self-tests
        run: |
          mkdir -p /tmp/collatz_native
          gcc -O3 -std=c17 -mbmi2 -Wall -Wextra -Werror \
            problems/collatz-conjecture/native/collatz_catalytic.c -o /tmp/collatz_native/collatz_catalytic
          /tmp/collatz_native/collatz_catalytic self-test
          gcc -O3 -std=c17 -Wall -Wextra -Werror \
            problems/collatz-conjecture/native/collatz_asymmetric_hydra.c -lm -o /tmp/collatz_native/collatz_hydra
          /tmp/collatz_native/collatz_hydra self-test

      - name: Run ASan + UBSan sanitized C17 engines & 500,000-case fuzzers (250k catalytic + 250k Hydra)
        run: |
          gcc -O1 -g -std=c17 -fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra -Werror \
            problems/collatz-conjecture/native/collatz_catalytic.c -o /tmp/collatz_native/collatz_san
          /tmp/collatz_native/collatz_san self-test
          gcc -O2 -g -std=c17 -DSTANDALONE_FUZZ_MAIN -fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra -Werror \
            problems/collatz-conjecture/native/fuzz_collatz_catalytic.c -o /tmp/collatz_native/fuzz_collatz
          /tmp/collatz_native/fuzz_collatz
          gcc -O1 -g -std=c17 -fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra -Werror \
            problems/collatz-conjecture/native/collatz_asymmetric_hydra.c -lm -o /tmp/collatz_native/hydra_san
          /tmp/collatz_native/hydra_san self-test
          gcc -O2 -g -std=c17 -DSTANDALONE_FUZZ_MAIN -fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra -Werror \
            problems/collatz-conjecture/native/fuzz_collatz_hydra.c -lm -o /tmp/collatz_native/fuzz_hydra
          /tmp/collatz_native/fuzz_hydra

      - name: Build safe Rust cross-oracles (zero unsafe) & verify bit-exact C17 == Rust == Python parity
        run: |
          rustc -O problems/collatz-conjecture/native/collatz_catalytic_oracle.rs -o /tmp/collatz_native/collatz_oracle
          rustc -O problems/collatz-conjecture/native/collatz_hydra_oracle.rs -o /tmp/collatz_native/hydra_oracle
          /tmp/collatz_native/collatz_catalytic target-tail \
            --source-max-depth 10 --target-max-depth 20 \
            --target-cutoffs 12,14,16,18,20 --thresholds 8,10,12,14,16,18,20,22,24 \
            --output /tmp/collatz_native/c_s10_t20.json
          /tmp/collatz_native/collatz_oracle target-tail 3 10 1 20 > /tmp/collatz_native/rs_s10_t20.json
          /tmp/collatz_native/collatz_catalytic residue-mine --max-depth 24 > /tmp/collatz_native/c_r24.json
          /tmp/collatz_native/collatz_oracle residue-mine 24 > /tmp/collatz_native/rs_r24.json
          /tmp/collatz_native/collatz_hydra run --max-bits 16 --output /tmp/collatz_native/c_hydra16.json
          /tmp/collatz_native/hydra_oracle 16 > /tmp/collatz_native/rs_hydra16.json
          python3 - <<'PY'
          import json
          py = json.load(open("problems/collatz-conjecture/experiments/results/odd_unit_lock_target_tail_s10_t20_20260705.json"))
          c = json.load(open("/tmp/collatz_native/c_s10_t20.json"))
          rs = json.load(open("/tmp/collatz_native/rs_s10_t20.json"))
          assert py["by_target_cutoff"]["20"]["valuation_histogram"] == c["by_target_cutoff"]["20"]["valuation_histogram"] == rs["valuation_histogram"]
          assert py["by_target_cutoff"]["20"]["max_valuation_e"] == c["by_target_cutoff"]["20"]["max_valuation_e"] == rs["max_valuation_e"]
          cr = json.load(open("/tmp/collatz_native/c_r24.json"))
          rr = json.load(open("/tmp/collatz_native/rs_r24.json"))
          for k in ("certified_leaves", "frontier_leaves", "certified_units_mod_2^max_depth", "frontier_units_mod_2^max_depth", "max_q_threshold"):
              assert cr[k] == rr[k], (k, cr[k], rr[k])
          ch = json.load(open("/tmp/collatz_native/c_hydra16.json"))
          rh = json.load(open("/tmp/collatz_native/rs_hydra16.json"))
          t16 = [t for t in ch["vector_b_minimax_game"]["tiers"] if t["bits"] == 16][0]
          assert t16["demon_stop"]["n"] == rh["vector_b_demon_stop_n"] == 35655
          assert t16["demon_total"]["n"] == rh["vector_b_demon_total_n"] == 52527
          assert t16["sibling_3n_minus_1"]["to_5_cycle"] == rh["vector_b_sibling_basins"]["to_5"]
          assert t16["sibling_3n_minus_1"]["to_17_cycle"] == rh["vector_b_sibling_basins"]["to_17"]
          assert rh["vector_d_karp_72"]["plus"] == rh["vector_d_karp_72"]["minus"] == "4/5"
          assert rh["vector_d_box_50"]["plus"] == "1/2" and rh["vector_d_box_50"]["minus_no1"] == "2/3"
          print("OK: Bit-exact C17 == Safe Rust == Python parity verified on catalytic + 5-vector Asymmetric Hydra.")
          PY

  static-security-audit:
    name: Static Analysis · Typecheck · Security · Build Standard v1.2.0 Audit (report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install tools
        run: python -m pip install -r requirements-lock.txt pip-audit

      - name: Lint (ruff — core + Collatz experiment syntax/closure guard, report-only)
        continue-on-error: true
        run: |
          ruff check scripts rag tests examples
          ruff check --select E9,F63,F7,F82,B023 problems/collatz-conjecture/experiments

      - name: Strict type check (mypy across all 20 core Python modules, report-only)
        continue-on-error: true
        run: mypy --explicit-package-bases scripts rag examples

      - name: Dependency vulnerability scan (pip-audit, report-only)
        continue-on-error: true
        run: pip-audit -r requirements-lock.txt

      - name: Secret scan (gitleaks 8.30.1 SHA-256 verified, full history, report-only)
        continue-on-error: true
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 0 --report-format json --report-path gitleaks.json
          echo "gitleaks findings: $(grep -c '\"RuleID\"' gitleaks.json || true)" >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency OSV scan (osv-scanner 2.7.1 SHA-256 verified, report-only)
        continue-on-error: true
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner --recursive . > osv.txt 2>&1 || true
          { echo '### osv-scanner'; echo '```'; tail -n 40 osv.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Standard v1.2.0 repository audit (report-only)
        continue-on-error: true
        run: bash scripts/audit-repo.sh --json audit.json --markdown "$GITHUB_STEP_SUMMARY" .

      - name: Upload audit & security reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-standard-and-security-reports
          path: |
            audit.json
            gitleaks.json
            osv.txt
