# Daily mirror of ALL lefttosolve.com research programs (currently 26 programs / 62k+ targets) into data/external/ + docs/external/.
# Commits straight to main only when the upstream data actually changed (Build Standard v1.2.0 R1:
# no PRs, no branches). A failed completeness/consistency/A24 guard writes nothing and turns this run red.
name: Daily External Program Sync (lefttosolve.com)

on:
  schedule:
    - cron: "37 7 * * *"   # once per day, 07:37 UTC
  workflow_dispatch:

permissions:
  contents: write   # push the refreshed snapshot to main
  actions: write    # dispatch the Pages workflow (GITHUB_TOKEN pushes do not trigger workflows)

concurrency:
  group: sync-external
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch, verify & commit all external program lists (lefttosolve.com)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Live full-catalogue fetch (all programs; fail-closed on inconsistency)
        run: python scripts/sync_external_programs.py

      - name: Offline integrity, shard size (<5 MB A24) & view re-check
        run: |
          python scripts/sync_external_programs.py --check
          python -c "import pathlib; big=[str(p) for p in pathlib.Path('data/external').rglob('*') if p.is_file() and p.stat().st_size >= 5*1024*1024]; assert not big, big; print('PASS: all data/external files < 5 MB (Build Standard A24)')"

      - name: Commit straight to main when data changed
        id: commit
        run: |
          changed=false
          if [ -n "$(git status --porcelain -- data/external docs/external)" ]; then
            git config user.name "Alexander S. Donahue"
            git config user.email "0_0@0thernes.art"
            git add data/external docs/external
            git commit -m "chore(external): daily lefttosolve.com full program sync $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          {
            echo "### External program sync (all lefttosolve.com programs)"
            python - <<'PY'
          import json
          s = json.load(open("data/external/lefttosolve/snapshot.json", encoding="utf-8"))
          t = s["totals"]
          print(f"- last content change: `{s['last_changed_utc']}`")
          print(f"- programs: {t['programs']} · targets: {t['sum_card_targets']:,} · mirrored items: {t['mirrored_items']:,} · consistent: {t['consistent']}")
          print(f"- solved_by_kind: `{t.get('solved_by_kind')}`")
          PY
            echo "- committed this run: $changed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Redeploy GitHub Pages with the refreshed lists
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
