# Runs after a v* tag is pushed. Publishes CHANGELOG notes, artifacts, dual RFC 3161/OTS timestamps,
# SHA256SUMS, and (on public repos) SLSA build provenance attestations. Never gates a push.
name: Release & SLSA Provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Package · SHA256SUMS · SLSA Attestation · GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify VERSION matches git tag
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          FILE_VER="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG_VER" != "$FILE_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($FILE_VER)"
            exit 1
          fi

      - name: Set up Python 3.12 & verify integrity before packaging
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -r requirements-lock.txt
          python scripts/generate.py --check
          python scripts/validate.py
          python scripts/check_retractions.py --check
          python scripts/check_readme_axioms.py
          python scripts/build_data_manifest.py --check
          python scripts/timestamp_manifest.py --check

      - name: Build reproducible source tarball, white paper assets, timestamps & SHA256SUMS
        run: |
          mkdir -p dist
          TARBALL="dist/unsolved-mathematics-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar --prefix="unsolved-mathematics-${GITHUB_REF_NAME}/" HEAD | gzip -n -9 > "$TARBALL"
          cp data/MANIFEST.sha256 "dist/MANIFEST-${GITHUB_REF_NAME}.sha256"
          cp data/MANIFEST.sha256.tsr "dist/MANIFEST-${GITHUB_REF_NAME}.sha256.tsr"
          cp data/MANIFEST.sha256.ots "dist/MANIFEST-${GITHUB_REF_NAME}.sha256.ots"
          cp data/problems.json "dist/problems-${GITHUB_REF_NAME}.json"
          cp paper/Donahue_2026_unsolved_mathematics_atlas.pdf "dist/Donahue_2026_unsolved_mathematics_atlas-${GITHUB_REF_NAME}.pdf"
          cp paper/arxiv_submission.tar.gz "dist/arxiv_submission-${GITHUB_REF_NAME}.tar.gz"
          (cd dist && sha256sum \
            "unsolved-mathematics-${GITHUB_REF_NAME}.tar.gz" \
            "MANIFEST-${GITHUB_REF_NAME}.sha256" \
            "MANIFEST-${GITHUB_REF_NAME}.sha256.tsr" \
            "MANIFEST-${GITHUB_REF_NAME}.sha256.ots" \
            "problems-${GITHUB_REF_NAME}.json" \
            "Donahue_2026_unsolved_mathematics_atlas-${GITHUB_REF_NAME}.pdf" \
            "arxiv_submission-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Generate SLSA build provenance attestation
        uses: actions/attest-build-provenance@v4
        continue-on-error: true
        with:
          subject-path: |
            dist/unsolved-mathematics-*.tar.gz
            dist/SHA256SUMS
            dist/MANIFEST-*.sha256
            dist/MANIFEST-*.sha256.tsr
            dist/MANIFEST-*.sha256.ots
            dist/problems-*.json
            dist/Donahue_2026_unsolved_mathematics_atlas-*.pdf
            dist/arxiv_submission-*.tar.gz

      - name: Extract release notes from CHANGELOG.md
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          {
            echo
            echo "Verify release checksums and SLSA provenance:"
            echo "\`\`\`bash"
            echo "sha256sum -c SHA256SUMS"
            echo "gh attestation verify unsolved-mathematics-${GITHUB_REF_NAME}.tar.gz --repo $GITHUB_REPOSITORY"
            echo "\`\`\`"
          } >> notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
