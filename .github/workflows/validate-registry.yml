name: Validate Registry

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "data/**"
      - "schema/**"
      - "scripts/**"
      - "lean/**"
      - "ro-crate-metadata.json"
      - "croissant.json"
      - ".github/workflows/validate-registry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Schema · Integrity · Axioms · Manifest · Timestamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Schema-validate registry
        run: python scripts/generate.py --check
      - name: Full integrity, sweep, retraction, axiom-parity, manifest & timestamp gates
        run: |
          python scripts/validate.py
          python scripts/check_papers.py
          python scripts/proof_claim_sweep.py
          python scripts/check_retractions.py --check
          python scripts/check_readme_axioms.py
          python scripts/build_data_manifest.py --check
          python scripts/timestamp_manifest.py --check
