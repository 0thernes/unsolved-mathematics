name: Validate Registry

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "data/**"
      - "schema/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  schema:
    name: Schema · Integrity · Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - run: python -m pip install -r requirements-lock.txt
      - name: Schema-validate registry
        run: python scripts/generate.py --check
      - name: Integrity & manifest gate
        run: |
          python scripts/validate.py
          python scripts/build_data_manifest.py --check
